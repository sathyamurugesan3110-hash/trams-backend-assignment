version: '3.8'

services:
  # 1. NATS Server Service
  nats:
    image: nats:latest
    ports:
      - "4222:4222"

  # 2. User Service
  user-service:
    build: ./user-service
    ports:
      - "8001:8001"
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

  # 3. Notification Service
  notification-service:
    build: ./notification-service
    environment:
      - NATS_URL=nats://nats:4222
    depends_on:
      - nats

  # 4. API Gateway Service
  api-gateway:
    build: ./api-gateway
    ports:
      - "8000:8000"
    environment:
      - NATS_URL=nats://nats:4222
      - USER_SERVICE_URL=http://user-service:8001
    depends_on:
      - nats
      - user-service